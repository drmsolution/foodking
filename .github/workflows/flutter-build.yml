name: Flutter Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-customer:
    name: Build Customer Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter pub get

      - name: Build APK
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: 1 - Deployment (source code)/source-code/app/customer/build/app/outputs/flutter-apk/*.apk

  build-android-delivery:
    name: Build Delivery Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter pub get

      - name: Build APK
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-apk
          path: 1 - Deployment (source code)/source-code/app/delivery/build/app/outputs/flutter-apk/*.apk

  build-ios-customer:
    name: Build Customer iOS (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter pub get

      - name: Patch Podfile (remove RunnerTests target)
        working-directory: 1 - Deployment (source code)/source-code/app/customer/ios
        run: |
          if [ -f Podfile ]; then
            sed -i '' '/^target .RunnerTests/,/^end$/d' Podfile
            echo "Patched Podfile"
          else
            echo "No Podfile found, will be generated during build"
          fi

      - name: Build iOS (no codesign)
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: customer-ios
          path: 1 - Deployment (source code)/source-code/app/customer/build/ios/

  build-ios-delivery:
    name: Build Delivery iOS (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter pub get

      - name: Patch Podfile (remove RunnerTests target)
        working-directory: 1 - Deployment (source code)/source-code/app/delivery/ios
        run: |
          if [ -f Podfile ]; then
            sed -i '' '/^target .RunnerTests/,/^end$/d' Podfile
            echo "Patched Podfile"
          else
            echo "No Podfile found, will be generated during build"
          fi

      - name: Build iOS (no codesign)
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: delivery-ios
          path: 1 - Deployment (source code)/source-code/app/delivery/build/ios/
