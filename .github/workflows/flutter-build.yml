name: Flutter Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-customer:
    name: Build Customer Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter pub get

      - name: Build APK
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: 1 - Deployment (source code)/source-code/app/customer/build/app/outputs/flutter-apk/*.apk

  build-android-delivery:
    name: Build Delivery Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter pub get

      - name: Build APK
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delivery-apk
          path: 1 - Deployment (source code)/source-code/app/delivery/build/app/outputs/flutter-apk/*.apk

  build-ios-customer:
    name: Build Customer iOS (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Patch Flutter Podfile template (remove RunnerTests)
        run: |
          echo "=== Templates before patch ==="
          ls -la "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/"
          for f in "$FLUTTER_ROOT"/packages/flutter_tools/templates/cocoapods/Podfile-ios*; do
            if [ -f "$f" ]; then
              echo "--- Patched: $f ---"
              python3 -c "import re; f='$f'; c=open(f).read(); c=re.sub(r'^[ ]*target .RunnerTests.*\n(?:[ ]*.*\n)*?[ ]*end\n','',c,flags=re.MULTILINE); c=re.sub(r'^# platform :ios, .*','platform :ios, \"14.0\"',c,flags=re.MULTILINE); open(f,'w').write(c)"
            fi
          done

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter pub get

      - name: Pre-install pods (update CDN cache)
        working-directory: 1 - Deployment (source code)/source-code/app/customer/ios
        run: |
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update

      - name: Build iOS (no codesign)
        working-directory: 1 - Deployment (source code)/source-code/app/customer
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: customer-ios
          path: 1 - Deployment (source code)/source-code/app/customer/build/ios/

  build-ios-delivery:
    name: Build Delivery iOS (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'

      - name: Patch Flutter Podfile template (remove RunnerTests)
        run: |
          echo "=== Templates before patch ==="
          ls -la "$FLUTTER_ROOT/packages/flutter_tools/templates/cocoapods/"
          for f in "$FLUTTER_ROOT"/packages/flutter_tools/templates/cocoapods/Podfile-ios*; do
            if [ -f "$f" ]; then
              echo "--- Patched: $f ---"
              python3 -c "import re; f='$f'; c=open(f).read(); c=re.sub(r'^[ ]*target .RunnerTests.*\n(?:[ ]*.*\n)*?[ ]*end\n','',c,flags=re.MULTILINE); c=re.sub(r'^# platform :ios, .*','platform :ios, \"14.0\"',c,flags=re.MULTILINE); open(f,'w').write(c)"
            fi
          done

      - name: Get dependencies
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter pub get

      - name: Pre-install pods (update CDN cache)
        working-directory: 1 - Deployment (source code)/source-code/app/delivery/ios
        run: |
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update

      - name: Build iOS (no codesign)
        working-directory: 1 - Deployment (source code)/source-code/app/delivery
        run: flutter build ios --no-codesign --debug

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: delivery-ios
          path: 1 - Deployment (source code)/source-code/app/delivery/build/ios/
