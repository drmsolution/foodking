plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.inilabs.foodking'
    compileSdkVersion 35
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.inilabs.foodking"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
    implementation "com.google.firebase:firebase-messaging:23.1.1"
    implementation platform('com.google.firebase:firebase-bom:30.2.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}

// Workaround for google_api_headers 4.3.5 Kotlin 2.0 null safety
task patchGoogleApiHeaders {
    doLast {
        def srcDir = file("${project.projectDir}/.symlinks/plugins/google_api_headers/android/src/main/kotlin")
        if (srcDir.exists()) {
            fileTree(srcDir).include("**/*.kt").each { f ->
                def text = f.text
                def patched = text.replaceAll(/\\)\.signingInfo\.apkContentsSigners/, ')?.signingInfo?.apkContentsSigners')
                if (patched != text) {
                    f.text = patched
                    println "Patched google_api_headers: ${f.name}"
                }
            }
        } else {
            println "WARNING: google_api_headers source not found at ${srcDir}"
        }
    }
}
tasks.whenTaskAdded { task ->
    if (task.name.toLowerCase().contains('compile') && task.name.toLowerCase().contains('kotlin')) {
        task.dependsOn patchGoogleApiHeaders
    }
}
